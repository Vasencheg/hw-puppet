name: Build Firmware (ESP32-S3)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MicroPython Dual-CDC Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/lib/micropython"

      - name: Build Firmware
        run: |
          ./build.sh --clean

      - name: Inspect Build Artifacts
        run: |
          ls -la build/
          git describe --tags --always --dirty

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hw-puppet-esp32s3-firmware
          path: |
            build/firmware.bin
            build/bootloader.bin
            build/partition-table.bin
            build/micropython.bin
            build/micropython.elf
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/firmware.bin
            build/bootloader.bin
            build/partition-table.bin
            build/micropython.bin
          generate_release_notes: true
